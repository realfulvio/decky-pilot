<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Decky Pilot: dal gioco all’aiuto utile</title><desc id="desc">Diagramma concettuale: conferma il gioco, premi Help me now, autorizza separatamente cattura e invio, combina immagine recente e sessione, ricevi passi utili o una domanda e voce facoltativa. La cattura automatica è disabilitata in attesa di integrazione sicura e verifiche su Steam Deck.</desc>
<rect width="1200" height="390" rx="20" fill="#10273c"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="30" y="40" fill="#8ae4cf" font-size="15" letter-spacing="2">IL TUO GIOCO → LA TUA SCHERMATA → IL PROSSIMO PASSO</text>
<g fill="#163448" stroke="#4d7689"><rect x="30" y="66" width="218" height="215" rx="14"/><rect x="261" y="66" width="218" height="215" rx="14"/><rect x="492" y="66" width="218" height="215" rx="14"/><rect x="723" y="66" width="218" height="215" rx="14"/><rect x="954" y="66" width="218" height="215" rx="14"/></g>
<g fill="#88e2ce" font-size="34" font-weight="700"><text x="49" y="113">01</text><text x="280" y="113">02</text><text x="511" y="113">03</text><text x="742" y="113">04</text><text x="973" y="113">05</text></g>
<g fill="#f4f8fc" font-size="21" font-weight="700"><text x="49" y="151">Apri il gioco</text><text x="280" y="151">Help me now</text><text x="511" y="151">Il tuo consenso</text><text x="742" y="151">Leggi il momento</text><text x="973" y="151">Un passo utile</text></g>
<g fill="#ccdde8" font-size="17"><text x="49" y="186">Titolo Steam, se noto.</text><text x="49" y="213">Conferma o correggi.</text><text x="49" y="244">Non Steam? Aggiungilo.</text><text x="280" y="186">Chiedi aiuto ora.</text><text x="280" y="213">Spiega cosa hai provato</text><text x="280" y="240">o cosa vuoi ottenere.</text><text x="511" y="186">Consenso alla cattura.</text><text x="511" y="213">Consenso all’invio.</text><text x="511" y="244">Solo la tua AI scelta.</text><text x="742" y="186">Immagine + sessione.</text><text x="742" y="213">Osservazioni visibili</text><text x="742" y="240">e deduzioni esplicite.</text><text x="973" y="186">Passi o una domanda.</text><text x="973" y="213">Voce facoltativa.</text><text x="973" y="244">Pausa immediata.</text></g>
<rect x="30" y="302" width="1142" height="58" rx="10" fill="#3c3324" stroke="#8d7653"/><text x="48" y="325" fill="#f1d7a4" font-size="16">FLUSSO CONCETTUALE · Cattura automatica disabilitata: servono integrazione sicura sul solo gioco e test Steam Deck.</text><text x="48" y="347" fill="#e1d4bb" font-size="15">L’importazione manuale è disponibile nel percorso di revisione dell’MVP. Non equivale alla cattura automatica.</text></g></svg>
