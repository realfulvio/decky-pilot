name: Segnalazione problema
description: Problema riproducibile, senza dati privati
body:
  - type: textarea
    id: versions
    attributes:
      label: Versioni e ambiente
      description: SteamOS, Steam client, Decky, plugin; indica se è un test offline.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Passaggi, comportamento atteso e risultato
      description: Non allegare API key, screenshot privati, note o cronologia reale.
    validations:
      required: true
  - type: textarea
    id: safe_diagnostics
    attributes:
      label: Diagnostica sanitizzata rivista prima dell'invio
