name: Verify Decky Pilot
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
concurrency:
  group: deckpilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.20.0'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '10.28.2'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.7'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r requirements-dev.txt
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:tooling
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - run: python -m ruff check backend main.py scripts tests/backend
      - run: python -m pytest -q
      - run: python scripts/scan_secrets.py
      - run: python scripts/verify_presentation.py
      - run: node scripts/audit.mjs
      - run: pnpm build
      - run: python scripts/vendor.py
      - run: python scripts/package.py
      - name: Validate extracted package on isolated Linux CPython 3.11
        run: python scripts/verify_package.py artifacts/deckpilot-0.1.0.zip --runtime
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deckpilot-mvp
          path: artifacts/deckpilot-*.zip*
          retention-days: 7
          if-no-files-found: error
