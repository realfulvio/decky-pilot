[project]
name = "deckpilot"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = ["Pillow==12.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".api-cache", "vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "ASYNC"]
